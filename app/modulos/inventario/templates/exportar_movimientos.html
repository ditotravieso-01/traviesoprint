{% extends "base.html" %}

{% block title %}Exportar Movimientos · Inventario{% endblock %}

{% block page_title %}📤 Exportar Movimientos{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
    <div class="form-section">
        <h4>Seleccionar período</h4>
        <form method="POST" action="{{ url_for('inventario.exportar_movimientos') }}">
            <div class="form-group">
                <label>Fecha inicio</label>
                <input type="date" name="fecha_inicio" value="{{ fecha_inicio_defecto }}">
            </div>
            <div class="form-group">
                <label>Fecha fin</label>
                <input type="date" name="fecha_fin" value="{{ fecha_fin_defecto }}">
            </div>
            <div class="form-group">
                <label>Producto (opcional)</label>
                <select name="producto_id">
                    <option value="">Todos</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-download"></i> Exportar</button>
            <a href="{{ url_for('inventario.index') }}" class="btn btn-outline">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

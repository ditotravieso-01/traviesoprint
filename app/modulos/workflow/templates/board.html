{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
    // ============================================================
    // VARIABLES GLOBALES
    // ============================================================
    let columnasInfo = [];
    let columnasAgrupadas = {};
    let ahora = null;
    let puedeCambiarPrioridad = false;
    let columnasPermitidas = [];
    let puedeEliminar = false;
    let ordenesCache = [];
    let userRole = '';

    // ============================================================
    // UTILIDADES
    // ============================================================
    function timeSince(timestamp) {
        if (!timestamp) return '—';
        const diff = Date.now() - new Date(timestamp).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return '<1m';
        if (mins < 60) return mins + 'm';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h';
        const days = Math.floor(hours / 24);
        return days + 'd';
    }

    function tiempoEnColumna(orden, columnaId) {
        const historial = orden.historial || [];
        let ultimaEntrada = null;
        for (let i = historial.length - 1; i >= 0; i--) {
            if (historial[i].columna === columnaId) {
                ultimaEntrada = historial[i];
                break;
            }
        }
        if (ultimaEntrada) {
            const fecha = ultimaEntrada.fecha || ultimaEntrada.timestamp || Date.now();
            return timeSince(fecha);
        }
        if (columnaId === 'pendiente' && orden.created_at) {
            return timeSince(orden.created_at);
        }
        return '—';
    }

    function calcularTiempoTotal(orden) {
        const historial = orden.historial || [];
        if (historial.length < 2) return '—';
        let totalMs = 0;
        for (let i = 0; i < historial.length - 1; i++) {
            const entrada = historial[i];
            const salida = historial[i + 1];
            const fechaIn = new Date(entrada.fecha || entrada.timestamp || Date.now());
            const fechaOut = new Date(salida.fecha || salida.timestamp || Date.now());
            totalMs += fechaOut - fechaIn;
        }
        const ultima = historial[historial.length - 1];
        if (ultima) {
            const fechaIn = new Date(ultima.fecha || ultima.timestamp || Date.now());
            totalMs += Date.now() - fechaIn;
        }
        if (totalMs < 0) return '—';
        const totalMins = Math.floor(totalMs / 60000);
        if (totalMins < 1) return '<1m';
        if (totalMins < 60) return totalMins + 'm';
        const totalHours = Math.floor(totalMins / 60);
        if (totalHours < 24) return totalHours + 'h ' + (totalMins % 60) + 'm';
        const totalDays = Math.floor(totalHours / 24);
        return totalDays + 'd ' + (totalHours % 24) + 'h';
    }

    function obtenerOrden(id) {
        return ordenesCache.find(o => o.id === id);
    }

    function mostrarToast(mensaje, tipo = '') {
        const toast = document.getElementById('toast');
        toast.textContent = mensaje;
        toast.className = 'toast ' + tipo;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============================================================
    // ACCIONES (expuestas globalmente)
    // ============================================================
    window.enviarWhatsApp = function(id) {
        fetch('/ordenes/detalle_json/' + id)
            .then(r => r.json())
            .then(data => {
                const telefono = data.telefono_cliente || '';
                const mensaje = encodeURIComponent(
                    `📄 *Orden ${data.numero}*\n` +
                    `Cliente: ${data.cliente}\n` +
                    `Prioridad: ${data.prioridad}\n` +
                    `Tipo: ${data.tipo || 'otros'}\n` +
                    `Descripción: ${data.descripcion || 'Sin descripción'}\n` +
                    `📎 Adjuntamos PDF en breve.`
                );
                let url = 'https://api.whatsapp.com/send?text=' + mensaje;
                if (telefono) {
                    // Limpiar el número: eliminar espacios, guiones, etc.
                    const numLimpio = telefono.replace(/[\s\-\(\)\+]/g, '');
                    if (numLimpio.startsWith('53')) {
                        url = 'https://wa.me/' + numLimpio + '?text=' + mensaje;
                    } else {
                        url = 'https://wa.me/53' + numLimpio + '?text=' + mensaje;
                    }
                }
                window.open(url, '_blank');
            })
            .catch(() => mostrarToast('Error al obtener datos para WhatsApp', 'error'));
    };

    window.irCliente = function(clienteId) {
        if (clienteId) {
            window.location.href = '/clientes/detalle/' + clienteId;
        } else {
            mostrarToast('Cliente no identificado', 'error');
        }
    };

    window.eliminarOrden = function(id) {
        if (!confirm('¿Eliminar esta orden permanentemente?')) return;
        fetch('/workflow/eliminar/' + id, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    mostrarToast('Orden eliminada', 'success');
                    window.location.reload();
                } else {
                    mostrarToast('Error: ' + (data.error || 'No autorizado'), 'error');
                }
            })
            .catch(() => mostrarToast('Error de conexión', 'error'));
    };

    window.moverSiguiente = function(id) {
        const orden = obtenerOrden(id);
        if (!orden) {
            mostrarToast('Orden no encontrada', 'error');
            return;
        }
        const indices = columnasInfo.map(c => c.id);
        const idx = indices.indexOf(orden.column);
        if (idx === -1 || idx === indices.length - 1) {
            mostrarToast('Ya está en la última columna', 'error');
            return;
        }
        const nuevaColumna = indices[idx + 1];
        moverOrden(id, nuevaColumna);
    };

    window.moverOrden = function(id, nuevaColumna) {
        fetch('/workflow/mover/' + id, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ columna: nuevaColumna })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                mostrarToast('Orden movida a ' + columnasInfo.find(c => c.id === nuevaColumna)?.nombre, 'success');
                window.location.reload();
            } else {
                mostrarToast('Error: ' + data.error, 'error');
            }
        })
        .catch(() => mostrarToast('Error de conexión', 'error'));
    };

    window.abrirPanel = function(id) {
        const panel = document.getElementById('panelLateral');
        const overlay = document.getElementById('panelOverlay');
        document.getElementById('panelTitulo').textContent = 'Cargando...';
        document.getElementById('panelBody').innerHTML = '<div style="text-align:center;padding:20px;color:#888;">Cargando...</div>';
        document.getElementById('panelActions').innerHTML = '';
        panel.classList.add('open');
        overlay.classList.add('active');

        fetch('/ordenes/detalle_json/' + id)
            .then(r => r.json())
            .then(data => {
                document.getElementById('panelTitulo').textContent = `📄 ${data.numero}`;
                const body = document.getElementById('panelBody');
                const historialHtml = (data.historial || []).slice(-10).reverse().map(h => {
                    const fecha = h.fecha ? new Date(h.fecha).toLocaleString() : (h.timestamp ? new Date(h.timestamp).toLocaleString() : '');
                    const mensaje = h.mensaje || h.columna || 'Movimiento';
                    return `<div class="historial-item"><span>${mensaje}</span><span class="fecha">${fecha}</span></div>`;
                }).join('');

                const tiemposColumnas = columnasInfo.map(c => {
                    const tiempo = data.historial ? tiempoEnColumna(data, c.id) : '—';
                    return `<div class="historial-item"><span>${c.nombre}</span><span>${tiempo}</span></div>`;
                }).join('');

                const tiempoTotal = calcularTiempoTotal(data);

                body.innerHTML = `
                    <div class="campo">
                        <span class="label">Cliente</span>
                        <span class="valor"><a onclick="irCliente(${data.cliente_id})">${data.cliente}</a></span>
                    </div>
                    <div class="campo">
                        <span class="label">Teléfono</span>
                        <span class="valor">${data.telefono_cliente || '—'}</span>
                    </div>
                    <div class="campo">
                        <span class="label">Prioridad</span>
                        <span class="valor"><span class="badge prioridad ${data.prioridad}">${data.prioridad}</span></span>
                    </div>
                    <div class="campo">
                        <span class="label">Tipo</span>
                        <span class="valor">${data.tipo || 'otros'}</span>
                    </div>
                    <div class="campo">
                        <span class="label">Columna actual</span>
                        <span class="valor">${columnasInfo.find(c=>c.id===data.columna)?.nombre || data.columna}</span>
                    </div>
                    <div class="campo">
                        <span class="label">Tiempo en columna actual</span>
                        <span class="valor">${tiempoEnColumna(data, data.columna)}</span>
                    </div>
                    <div class="campo">
                        <span class="label">Tiempo total en flujo</span>
                        <span class="valor">${tiempoTotal}</span>
                    </div>
                    <div class="campo">
                        <span class="label">Entrada sistema</span>
                        <span class="valor">${data.entrada_ok ? '✅ OK' : '⏳ Pendiente'}</span>
                    </div>
                    ${data.descripcion ? `<div class="campo"><span class="label">Descripción</span><span class="valor">${data.descripcion}</span></div>` : ''}
                    ${data.servicios && data.servicios.length ? `<div class="campo"><span class="label">Servicios</span><span class="valor">${data.servicios.join(', ')}</span></div>` : ''}
                    ${data.materiales && Object.keys(data.materiales).length ? `<div class="campo"><span class="label">Materiales</span><span class="valor">${Object.entries(data.materiales).map(([k,v]) => `${k}: ${v}`).join(', ')}</span></div>` : ''}
                    ${data.archivos && data.archivos.length ? `<div class="campo"><span class="label">Archivos</span><span class="valor">${data.archivos.map(a => a.nombre).join(', ')}</span></div>` : ''}
                    <div class="seccion">
                        <h4><i class="fas fa-history"></i> Historial de movimientos</h4>
                        ${historialHtml || '<div class="historial-item">No hay movimientos</div>'}
                    </div>
                    <div class="seccion">
                        <h4><i class="fas fa-chart-simple"></i> Tiempo por columna</h4>
                        ${tiemposColumnas}
                    </div>
                `;

                const actions = document.getElementById('panelActions');
                let accionesHtml = '';

                if (data.columna !== 'entregados') {
                    accionesHtml += `<button class="btn btn-success" onclick="moverSiguiente(${data.id});cerrarPanel();"><i class="fas fa-arrow-right"></i> Mover</button>`;
                }

                if (userRole === 'comercial' || userRole === 'admin') {
                    accionesHtml += `<button class="btn btn-whatsapp" onclick="enviarWhatsApp(${data.id});cerrarPanel();"><i class="fab fa-whatsapp"></i> WhatsApp</button>`;
                }

                accionesHtml += `<button class="btn btn-outline" onclick="irCliente(${data.cliente_id});cerrarPanel();"><i class="fas fa-user"></i> Cliente</button>`;

                if (userRole === 'comercial' || userRole === 'admin') {
                    accionesHtml += `<button class="btn btn-outline" onclick="window.location.href='/ordenes/editar/${data.id}'"><i class="fas fa-edit"></i> Editar</button>`;
                } else {
                    accionesHtml += `<button class="btn btn-outline" onclick="window.location.href='/ordenes/detalle/${data.id}'"><i class="fas fa-eye"></i> Ver orden</button>`;
                }

                if (puedeEliminar) {
                    accionesHtml += `<button class="btn btn-danger" onclick="eliminarOrden(${data.id});cerrarPanel();"><i class="fas fa-trash-alt"></i> Eliminar</button>`;
                }

                actions.innerHTML = accionesHtml;
            })
            .catch(err => {
                document.getElementById('panelBody').innerHTML = '<div style="color:#dc2626;padding:20px;">Error al cargar los datos.</div>';
                console.error(err);
            });
    };

    window.cerrarPanel = function() {
        document.getElementById('panelLateral').classList.remove('open');
        document.getElementById('panelOverlay').classList.remove('active');
    };

    // ============================================================
    // RENDERIZADO
    // ============================================================
    function renderizar(filtros = {}) {
        const board = document.getElementById('board');
        board.innerHTML = '';

        let todas = [];
        columnasInfo.forEach(col => {
            const items = columnasAgrupadas[col.id] || [];
            items.forEach(o => {
                todas.push(o);
            });
        });
        ordenesCache = todas;

        let filtradas = [...todas];
        if (filtros.search) {
            const s = filtros.search.toLowerCase();
            filtradas = filtradas.filter(o =>
                o.order_num.toLowerCase().includes(s) ||
                (o.client && o.client.nombre && o.client.nombre.toLowerCase().includes(s))
            );
        }
        if (filtros.prioridad) {
            filtradas = filtradas.filter(o => o.priority === filtros.prioridad);
        }
        if (filtros.tipo) {
            filtradas = filtradas.filter(o => o.tipo_proyecto === filtros.tipo);
        }

        document.getElementById('resultCount').textContent = `(${filtradas.length} órdenes)`;

        columnasInfo.forEach(col => {
            const colDiv = document.createElement('div');
            colDiv.className = `columna ${col.id}`;
            colDiv.dataset.columna = col.id;

            let tarjetasCol = filtradas.filter(o => o.column === col.id);

            // Ordenar por prioridad: crítica > urgente > normal
            const ordenPrioridad = { 'critica': 0, 'urgente': 1, 'normal': 2 };
            tarjetasCol.sort((a, b) => {
                const prioA = ordenPrioridad[a.priority] ?? 3;
                const prioB = ordenPrioridad[b.priority] ?? 3;
                return prioA - prioB;
            });

            const header = document.createElement('div');
            header.className = 'cabecera';
            header.innerHTML = `<span><span class="icono">${col.icono}</span> ${col.nombre}</span><span class="contador">${tarjetasCol.length}</span>`;
            colDiv.appendChild(header);

            const list = document.createElement('div');
            list.className = 'card-list';
            list.dataset.columna = col.id;

            tarjetasCol.forEach(orden => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.dataset.id = orden.id;
                card.dataset.columna = orden.column;
                card.addEventListener('click', function(e) {
                    if (e.target.closest('button') || e.target.closest('.btn-hecho')) return;
                    abrirPanel(orden.id);
                });

                const prioridadClass = orden.priority || 'normal';
                const tipo = orden.tipo_proyecto || 'otros';
                const cliente = orden.client ? orden.client.nombre : 'Sin cliente';
                const clienteId = orden.client ? orden.client.id : null;
                const tiempo = tiempoEnColumna(orden, orden.column);

                card.innerHTML = `
                    <div class="titulo">
                        <span class="order-num">${orden.order_num}</span>
                        <span class="badge-tipo ${tipo}">${tipo}</span>
                    </div>
                    <div class="sub">
                        <span class="cliente" onclick="event.stopPropagation();irCliente(${clienteId})">${cliente}</span>
                        <span class="prioridad ${prioridadClass}">${orden.priority}</span>
                    </div>
                    <div class="sub" style="margin-top:2px;">
                        <span class="tiempo-columna"><i class="far fa-clock"></i> ${tiempo}</span>
                    </div>
                    <div class="acciones-mini">
                        ${col.id !== 'entregados' && columnasPermitidas.includes(col.id) ? `<button class="btn-hecho" data-id="${orden.id}">Hecho →</button>` : ''}
                    </div>
                `;
                list.appendChild(card);

                card.querySelector('.btn-hecho')?.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    moverSiguiente(id);
                });
            });

            colDiv.appendChild(list);
            board.appendChild(colDiv);

            // Sortable
            new Sortable(list, {
                group: 'kanban',
                animation: 150,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                onStart: function(evt) {
                    evt.from.closest('.columna').style.background = '#f0ece8';
                },
                onEnd: function(evt) {
                    const item = evt.item;
                    const ordenId = parseInt(item.dataset.id);
                    const nuevaColumna = evt.to.closest('.columna').dataset.columna;
                    const colOrigen = evt.from.closest('.columna');
                    const colDestino = evt.to.closest('.columna');
                    colOrigen.style.background = '';
                    colDestino.style.background = '';

                    if (ordenId && nuevaColumna) {
                        const orden = obtenerOrden(ordenId);
                        if (orden && orden.column !== nuevaColumna) {
                            moverOrden(ordenId, nuevaColumna);
                        }
                    }
                }
            });
        });
    }

    // ============================================================
    // FILTROS
    // ============================================================
    function obtenerFiltros() {
        return {
            search: document.getElementById('searchInput').value.trim(),
            prioridad: document.getElementById('priorityFilter').value,
            tipo: document.getElementById('typeFilter').value
        };
    }

    window.aplicarFiltros = function() {
        renderizar(obtenerFiltros());
    };

    window.limpiarFiltros = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('priorityFilter').value = '';
        document.getElementById('typeFilter').value = '';
        renderizar(obtenerFiltros());
    };

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        columnasInfo = {{ columnas_info|tojson }};
        columnasAgrupadas = {{ columnas|tojson }};
        ahora = {{ ahora.isoformat()|tojson }};
        puedeCambiarPrioridad = {{ puede_cambiar_prioridad|tojson }};
        columnasPermitidas = {{ columnas_permitidas|tojson }};
        puedeEliminar = {{ puede_eliminar|tojson }};
        userRole = {{ current_user.role|tojson }};

        renderizar(obtenerFiltros());

        const debounce = (fn, delay) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; };
        const applyFiltersDebounced = debounce(aplicarFiltros, 300);
        document.getElementById('searchInput').addEventListener('input', applyFiltersDebounced);
        document.getElementById('priorityFilter').addEventListener('change', aplicarFiltros);
        document.getElementById('typeFilter').addEventListener('change', aplicarFiltros);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') cerrarPanel();
        });

        console.log('🚀 Kanban integrado con panel neón oscuro + bloque flotante y WhatsApp con número de cliente.');
    });
</script>
{% endblock %}

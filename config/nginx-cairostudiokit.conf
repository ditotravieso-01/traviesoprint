# ------------------------------------------------------------
# Redirigir HTTP → HTTPS para todos los subdominios
# ------------------------------------------------------------
server {
    listen 80;
    server_name etiquetas.cairostudio.cu carteles.cairostudio.cu kit.cairostudio.cu;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# Configuración SSL común para todas las aplicaciones
# ------------------------------------------------------------
server {
    listen 443 ssl;
    server_name etiquetas.cairostudio.cu;

    ssl_certificate /etc/nginx/ssl/cairostudiokit.crt;
    ssl_certificate_key /etc/nginx/ssl/cairostudiokit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name carteles.cairostudio.cu;

    ssl_certificate /etc/nginx/ssl/cairostudiokit.crt;
    ssl_certificate_key /etc/nginx/ssl/cairostudiokit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name kit.cairostudio.cu;

    ssl_certificate /etc/nginx/ssl/cairostudiokit.crt;
    ssl_certificate_key /etc/nginx/ssl/cairostudiokit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/cairostudiokit/tools/kit;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------------------
# Bloquear cualquier otra solicitud (opcional)
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cairostudiokit.crt;
    ssl_certificate_key /etc/nginx/ssl/cairostudiokit.key;
    return 444;
}